<!-- Alpaca API Partial -->
<div class="space-y-6">
    <h2 class="text-2xl font-bold">Alpaca API Configuration</h2>
    
    <!-- Status Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4" id="alpacaStatusCard">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-medium">Connection Status</h3>
            <button hx-get="/api/alpaca/status" hx-target="#alpacaStatusCard" hx-swap="outerHTML"
                class="text-sm text-emerald-400 hover:text-emerald-300">Refresh</button>
        </div>
        <div id="statusContent">
            <div class="flex items-center gap-3 p-3 bg-slate-800/50 rounded-lg">
                <div class="w-3 h-3 rounded-full bg-gray-500" id="connDot"></div>
                <div>
                    <p class="font-medium" id="connText">Checking...</p>
                    <p class="text-sm text-slate-400" id="connDetail"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Credentials Form -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4" id="alpacaFormCard">
        <h3 class="text-lg font-medium mb-4">API Credentials</h3>
        <p class="text-sm text-slate-400 mb-4">
            Get your keys at <a href="https://alpaca.markets" target="_blank" class="text-emerald-400 hover:underline">alpaca.markets</a> → Dashboard → API Keys.
            Enable <strong>Trading</strong> and <strong>Market Data</strong> permissions.
        </p>
        
        <form id="alpacaForm" class="space-y-4" hx-post="/api/alpaca/credentials" hx-target="#alpacaFormResult" hx-swap="innerHTML">
            <div>
                <label class="block text-sm text-slate-300 mb-1">API Key (starts with PK...)</label>
                <input type="text" name="api_key" placeholder="PK..." required
                    class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-1">Secret Key</label>
                <input type="password" name="secret_key" placeholder="Secret key" required
                    class="w-full px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <button type="submit" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-lg transition-colors">
                Save Credentials
            </button>
        </form>
        <div id="alpacaFormResult" class="mt-4"></div>
    </div>

    <!-- Test Connection -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <h3 class="text-lg font-medium mb-4">Test Connection</h3>
        <button hx-post="/api/alpaca/test" hx-target="#testResult" hx-swap="innerHTML"
            class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-lg transition-colors">
            Test API Connection
        </button>
        <div id="testResult" class="mt-4"></div>
    </div>
</div>

<script>
    // Load Alpaca status
    async function loadAlpacaStatus() {
        try {
            const res = await fetch('/api/alpaca/status', {headers: authHeaders()});
            const status = await res.json();
            
            const dot = document.getElementById('connDot');
            const text = document.getElementById('connText');
            const detail = document.getElementById('connDetail');
            
            if (status.connected) {
                dot.className = 'w-3 h-3 rounded-full bg-emerald-500';
                text.textContent = 'Connected';
                text.className = 'font-medium text-emerald-400';
                detail.textContent = `Account: ${status.account} | Buying Power: $${status.buying_power?.toLocaleString() || 0}`;
            } else if (status.configured) {
                dot.className = 'w-3 h-3 rounded-full bg-yellow-500';
                text.textContent = 'Configured but not connected';
                text.className = 'font-medium text-yellow-400';
                detail.textContent = 'Check your API keys or network';
            } else {
                dot.className = 'w-3 h-3 rounded-full bg-red-500';
                text.textContent = 'Not configured';
                text.className = 'font-medium text-red-400';
                detail.textContent = 'Enter your API keys below';
            }
        } catch (e) {
            console.error('Status load error:', e);
        }
    }

    function authHeaders() {
        const token = document.cookie.split('; ').find(row => row.startsWith('access_token='));
        return {'Authorization': token ? 'Bearer ' + token.split('=')[1] : ''};
    }

    // Show form result
    document.body.addEventListener('htmx:afterSwap', function(evt) {
        if (evt.detail.target.id === 'alpacaFormResult') {
            const el = document.getElementById('alpacaFormResult');
            if (el.innerHTML.includes('ok')) {
                loadAlpacaStatus();
            }
        }
    });

    loadAlpacaStatus();
    setInterval(loadAlpacaStatus, 60000); // Check every minute
</script>
