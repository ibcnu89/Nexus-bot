<!-- Feed Partial - Social trading feed like FOMO -->
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold tracking-tight">Feed</h1>
        <div class="flex items-center gap-2">
            <select id="leaderboardWindow" class="bg-slate-800 border border-slate-700 text-white px-3 py-2 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                <option value="24h">24h</option>
                <option value="7d">7d</option>
                <option value="30d">30d</option>
                <option value="all">All Time</option>
            </select>
            <button class="btn-secondary px-4 py-2 rounded-xl text-sm font-semibold">
                <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                Refresh
            </button>
        </div>
    </div>

    <!-- FOMO Status -->
    <div id="fomoStatus" class="hidden p-3 bg-slate-800/50 border border-slate-700 rounded-xl text-sm">
        <div class="flex items-center gap-2 text-amber-400">
            <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/></svg>
            <span>Loading FOMO leaderboard...</span>
        </div>
    </div>

    <!-- Top Traders to Follow -->
    <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-4">
        <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
            <svg class="w-5 h-5 text-amber-500" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-1.917 1.917a12.061 12.061 0 015.048 5.048l-4.147 4.147a12.06 12.06 0 01-5.048 5.048l-1.923 1.923H4.26a16.581 16.581 0 01-4.894-3.275 1 1 0 011.414-1.414 14.58 14.58 0 005.707 5.707l3.466 3.466a1 1 0 001.414-1.414l-3.477-3.477a14.58 14.58 0 001.341-5.123l.109-.325a16.59 16.59 0 003.3-4.938 1 1 0 011.414 1.414c0 4.556-2.87 8.468-7 9.813v.228l1.787 1.787a1 1 0 010 1.414l-1.5 1.5a1 1 0 01-1.414 0L4.258 16.184a1 1 0 010-1.414l1.758-1.758v-.226A30.6 30.6 0 011.5 12c0-4.086 1.796-8.082 4.756-10.75z"/></svg>
            <span class="text-lg font-semibold">Top Traders</span>
            <span id="traderCount" class="text-sm text-slate-400 ml-2"></span>
        </h2>
        <div class="space-y-3" id="topTraders">
            <!-- Loaded via JS -->
        </div>
    </div>

    <!-- Recent Trades Feed -->
    <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-4">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold">Recent Activity</h2>
            <button class="text-sm text-emerald-400 hover:text-emerald-300">View All</button>
        </div>
        <div class="space-y-3" id="feedTrades">
            <div class="empty-state">
                <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                    <path d="M4 7V4h16"/><path d="M9 20H4"/><path d="M12 14v7"/><path d="M20 11v4h-3"/>
                </svg>
                <p>No recent trades to show</p>
                <p class="text-xs mt-1">Select a trader to see their trades</p>
            </div>
        </div>
    </div>

    <!-- Market Movers -->
    <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-4">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold">Biggest Movers</h2>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-slate-800/50 rounded-xl p-4">
                <h3 class="text-sm font-medium text-emerald-400 mb-3">Top Gainers</h3>
                <div class="space-y-2" id="topGainers">
                    <!-- Loaded via JS -->
                </div>
            </div>
            <div class="bg-slate-800/50 rounded-xl p-4">
                <h3 class="text-sm font-medium text-red-400 mb-3">Top Losers</h3>
                <div class="space-y-2" id="topLosers">
                    <!-- Loaded via JS -->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Trader Profile Modal -->
<div id="traderProfileModal" class="fixed inset-0 z-50 hidden overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4">
        <div class="fixed inset-0 bg-black/80" onclick="closeTraderProfile()"></div>
        <div class="relative bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden">
            <div class="flex items-center justify-between p-4 border-b border-slate-800">
                <h2 class="text-xl font-bold" id="profileTitle">Trader Profile</h2>
                <button onclick="closeTraderProfile()" class="p-2 hover:bg-slate-800 rounded-xl transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-4 overflow-y-auto max-h-[70vh]" id="profileContent">
                <!-- Loaded dynamically -->
            </div>
        </div>
    </div>
</div>

<script>
    let currentTraderHandle = null;
    let feedRefreshInterval = null;

    // Format percentage
    function formatPct(val) {
        return (val >= 0 ? '+' : '') + val.toFixed(2) + '%';
    }

    // Format currency
    function formatCurrency(val) {
        if (val >= 1e9) return '$' + (val / 1e9).toFixed(2) + 'B';
        if (val >= 1e6) return '$' + (val / 1e6).toFixed(2) + 'M';
        if (val >= 1e3) return '$' + (val / 1e3).toFixed(2) + 'K';
        return '$' + val.toFixed(2);
    }

    // Format number with commas
    function formatNumber(val) {
        return val.toLocaleString();
    }

    // Get auth headers
    function getAuthHeaders() {
        const token = document.cookie.split('; ').find(row => row.startsWith('access_token='));
        if (token) {
            return { 'Authorization': 'Bearer ' + token.split('=')[1] };
        }
        return {};
    }

    // Show error state
    function showError(containerId, message) {
        document.getElementById(containerId).innerHTML = `
            <div class="empty-state text-center py-6">
                <svg class="empty-icon mx-auto text-red-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
                </svg>
                <p class="mt-2">${message}</p>
            </div>
        `;
    }

    // Load FOMO leaderboard
    async function loadLeaderboard() {
        const window = document.getElementById('leaderboardWindow').value;
        const statusDiv = document.getElementById('fomoStatus');
        const tradersContainer = document.getElementById('topTraders');
        const countEl = document.getElementById('traderCount');
        
        statusDiv.classList.remove('hidden');
        tradersContainer.innerHTML = '';

        try {
            const res = await fetch(`/api/fomo/leaderboard?window=${window}&limit=20`, {
                headers: getAuthHeaders()
            });
            
            if (!res.ok) {
                if (res.status === 401) {
                    throw new Error('Authentication required');
                }
                if (res.status === 429) {
                    throw new Error('Rate limited - please wait');
                }
                throw new Error(`API error: ${res.status}`);
            }
            
            const data = await res.json();
            
            statusDiv.classList.add('hidden');
            countEl.textContent = `(${data.count} traders)`;
            
            if (!data.traders || data.traders.length === 0) {
                tradersContainer.innerHTML = `
                    <div class="empty-state">
                        <p>No traders found for ${window} window</p>
                    </div>
                `;
                return;
            }
            
            tradersContainer.innerHTML = data.traders.map(t => `
                <div class="flex items-center justify-between p-3 bg-slate-800/50 rounded-xl cursor-pointer hover:bg-slate-800 transition-colors" 
                     onclick="openTraderProfile('${t.handle}')">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500 to-orange-500 flex items-center justify-center font-bold text-white">
                            ${t.display_name?.charAt(0) || t.handle.charAt(0)}
                        </div>
                        <div>
                            <div class="font-semibold">${t.display_name || t.handle}</div>
                            <div class="text-xs text-slate-400">@${t.handle} • ${formatNumber(t.followers)} followers</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="font-semibold text-emerald-400">${formatCurrency(t.pnl_usd)}</div>
                        <div class="text-xs text-slate-400">${window} P&L • ${t.trades} trades</div>
                    </div>
                </div>
            `).join('');
            
        } catch (e) {
            console.error('Leaderboard load error:', e);
            statusDiv.classList.add('hidden');
            showError('topTraders', 'Failed to load leaderboard: ' + e.message);
        }
    }

    // Open trader profile modal
    async function openTraderProfile(handle) {
        currentTraderHandle = handle;
        const modal = document.getElementById('traderProfileModal');
        const content = document.getElementById('profileContent');
        const title = document.getElementById('profileTitle');
        
        modal.classList.remove('hidden');
        content.innerHTML = `
            <div class="flex items-center justify-center py-8">
                <svg class="animate-spin h-8 w-8 text-amber-500" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
            </div>
        `;
        title.textContent = `@${handle}`;

        try {
            // Load profile, trades, and holdings in parallel
            const [profileRes, tradesRes, holdingsRes] = await Promise.all([
                fetch(`/api/fomo/trader/${handle}`, { headers: getAuthHeaders() }),
                fetch(`/api/fomo/trader/${handle}/trades?limit=10`, { headers: getAuthHeaders() }),
                fetch(`/api/fomo/trader/${handle}/holdings`, { headers: getAuthHeaders() })
            ]);

            if (!profileRes.ok) throw new Error('Failed to load profile');
            
            const profile = await profileRes.json();
            const tradesData = await tradesRes.json();
            const holdingsData = await holdingsRes.json();

            title.textContent = profile.display_name || handle;

            // Build profile HTML
            let html = `
                <div class="space-y-6">
                    <!-- Header Stats -->
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-slate-800/50 rounded-xl p-4">
                            <div class="text-xs text-slate-400">Total P&L</div>
                            <div class="text-2xl font-bold text-emerald-400">${formatCurrency(profile.pnl_usd)}</div>
                        </div>
                        <div class="bg-slate-800/50 rounded-xl p-4">
                            <div class="text-xs text-slate-400">Followers</div>
                            <div class="text-2xl font-bold">${formatNumber(profile.followers)}</div>
                        </div>
                        <div class="bg-slate-800/50 rounded-xl p-4">
                            <div class="text-xs text-slate-400">Total Trades</div>
                            <div class="text-2xl font-bold">${formatNumber(profile.trades)}</div>
                        </div>
                        <div class="bg-slate-800/50 rounded-xl p-4">
                            <div class="text-xs text-slate-400">Holdings</div>
                            <div class="text-2xl font-bold">${profile.holdings}</div>
                        </div>
                    </div>

                    <!-- P&L by Window -->
                    <div class="bg-slate-800/50 rounded-xl p-4">
                        <h3 class="font-semibold mb-3">P&L by Window</h3>
                        <div class="grid grid-cols-4 gap-2 text-center">
            `;

            for (const [window, pnl] of Object.entries(profile.pnl_by_window || {})) {
                const pnlClass = pnl >= 0 ? 'text-emerald-400' : 'text-red-400';
                html += `
                    <div class="p-3 bg-slate-900/50 rounded-lg">
                        <div class="text-xs text-slate-400">${window}</div>
                        <div class="font-semibold ${pnlClass}">${formatCurrency(pnl)}</div>
                    </div>
                `;
            }

            html += `
                        </div>
                    </div>

                    <!-- Verified Badge -->
            `;

            if (profile.verified) {
                html += `
                    <div class="flex items-center gap-2 text-amber-400 text-sm">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                        <span>Verified on FOMO</span>
                    </div>
                `;
            }

            if (profile.clan) {
                html += `
                    <div class="text-sm text-slate-400">
                        <span class="font-medium">Clan:</span> ${profile.clan}
                    </div>
                `;
            }

            if (profile.account_age_days > 0) {
                html += `
                    <div class="text-sm text-slate-400">
                        <span class="font-medium">Account Age:</span> ${profile.account_age_days} days
                    </div>
                `;
            }

            // Wallets
            if (profile.wallets && Object.keys(profile.wallets).length > 0) {
                html += `
                    <div class="bg-slate-800/50 rounded-xl p-4">
                        <h3 class="font-semibold mb-3 flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a7 7 0 01-7 7M9 19l-6-6 6-6M9 10l6 6 6-6"/></svg>
                            Wallets
                        </h3>
                        <div class="space-y-2">
                `;
                
                for (const [chain, wallet] of Object.entries(profile.wallets)) {
                    if (wallet) {
                        const addr = typeof wallet === 'string' ? wallet : (wallet.address || JSON.stringify(wallet));
                        html += `
                            <div class="flex items-center justify-between p-2 bg-slate-900/50 rounded-lg">
                                <span class="font-mono text-xs">${chain}</span>
                                <span class="font-mono text-xs text-slate-400">${addr.slice(0, 12)}...${addr.slice(-8)}</span>
                            </div>
                        `;
                    }
                }
                
                html += `</div></div>`;
            }

            // Recent Trades
            html += `
                <div>
                    <h3 class="font-semibold mb-3">Recent Trades</h3>
                    <div class="space-y-2" id="profileTrades">
            `;

            if (tradesData.trades && tradesData.trades.length > 0) {
                for (const trade of tradesData.trades) {
                    const pnl = trade.realized_pnl_usd || trade.unrealized_pnl_usd || 0;
                    const pnlClass = pnl >= 0 ? 'text-emerald-400' : 'text-red-400';
                    const statusBadge = trade.status === 'open' 
                        ? '<span class="px-2 py-0.5 bg-amber-500/20 text-amber-400 text-xs rounded">OPEN</span>'
                        : '<span class="px-2 py-0.5 bg-slate-700 text-slate-400 text-xs rounded">CLOSED</span>';
                    
                    html += `
                        <div class="p-3 bg-slate-800/50 rounded-xl flex items-center justify-between gap-2">
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2">
                                    <span class="font-medium">${trade.token_symbol}</span>
                                    ${statusBadge}
                                </div>
                                <div class="text-xs text-slate-400">${new Date(trade.created_at).toLocaleDateString()}</div>
                            </div>
                            <div class="text-right">
                                <div class="font-mono text-sm">Entry: $${trade.avg_entry_price.toFixed(6)}</div>
                                <div class="font-semibold ${pnlClass}">${formatCurrency(pnl)}</div>
                            </div>
                        </div>
                    `;
                }
            } else {
                html += '<div class="empty-state py-4"><p>No trades available</p></div>';
            }

            html += `</div></div>`;

            // Holdings
            html += `
                <div>
                    <h3 class="font-semibold mb-3">Current Holdings</h3>
                    <div class="space-y-2" id="profileHoldings">
            `;

            if (holdingsData.holdings && holdingsData.holdings.length > 0) {
                for (const h of holdingsData.holdings.slice(0, 10)) {
                    html += `
                        <div class="p-3 bg-slate-800/50 rounded-xl flex items-center justify-between">
                            <div>
                                <div class="font-medium">${h.token_symbol}</div>
                                <div class="text-xs text-slate-400">${h.chain}</div>
                            </div>
                            <div class="text-right">
                                <div class="font-mono text-sm">${h.amount.toLocaleString()}</div>
                                <div class="font-semibold text-emerald-400">${formatCurrency(h.total_value_usd)}</div>
                            </div>
                        </div>
                    `;
                }
            } else {
                html += '<div class="empty-state py-4"><p>No holdings data</p></div>';
            }

            html += `</div></div></div>`;

            content.innerHTML = html;

        } catch (e) {
            console.error('Profile load error:', e);
            content.innerHTML = `
                <div class="empty-state py-8">
                    <p class="text-red-400">Failed to load profile: ${e.message}</p>
                </div>
            `;
        }
    }

    function closeTraderProfile() {
        document.getElementById('traderProfileModal').classList.add('hidden');
        currentTraderHandle = null;
    }

    // Load market movers
    async function loadMovers() {
        try {
            const res = await fetch('/api/markets', { headers: getAuthHeaders() });
            const data = await res.json();
            
            const gainers = data.markets
                .filter(m => m.change_24h > 0)
                .sort((a, b) => b.change_24h - a.change_24h)
                .slice(0, 5);
            
            const losers = data.markets
                .filter(m => m.change_24h < 0)
                .sort((a, b) => a.change_24h - b.change_24h)
                .slice(0, 5);
            
            document.getElementById('topGainers').innerHTML = gainers.map(m => `
                <div class="flex justify-between py-2 border-b border-slate-800 last:border-0">
                    <span class="font-medium">${m.symbol.replace('USDT', '')}</span>
                    <span class="font-semibold text-emerald-400">+${formatPct(m.change_24h)}</span>
                </div>
            `).join('');
            
            document.getElementById('topLosers').innerHTML = losers.map(m => `
                <div class="flex justify-between py-2 border-b border-slate-800 last:border-0">
                    <span class="font-medium">${m.symbol.replace('USDT', '')}</span>
                    <span class="font-semibold text-red-400">${formatPct(m.change_24h)}</span>
                </div>
            `).join('');
            
        } catch (e) {
            console.error('Movers load error:', e);
        }
    }

    // Initialize feed
    async function initFeed() {
        await Promise.all([loadLeaderboard(), loadMovers()]);
    }

    // Set up refresh interval
    function startFeedRefresh() {
        if (feedRefreshInterval) clearInterval(feedRefreshInterval);
        feedRefreshInterval = setInterval(() => {
            loadLeaderboard();
            loadMovers();
        }, 60000); // Refresh every minute
    }

    // Event listeners
    document.getElementById('leaderboardWindow').addEventListener('change', loadLeaderboard);
    
    // Expose functions globally for onclick handlers
    window.openTraderProfile = openTraderProfile;
    window.closeTraderProfile = closeTraderProfile;

    // Initialize on load
    document.addEventListener('DOMContentLoaded', () => {
        initFeed();
        startFeedRefresh();
    });

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
        if (feedRefreshInterval) clearInterval(feedRefreshInterval);
    });
</script>
